name: UnsuspiciousBlocks
version: '0.1.2-SNAPSHOT'
main: com.mkikets.unsuspiciousBlocks.UnsuspiciousBlocks
api-version: '1.20'
description: "Plugin which simply fix \"Suspicious Sand\" and \"Suspicious Gravel\" placement to place back loot table of item"
permissions:
    unsuspiciousblocks.use:
        description: "Allows the use of UnsuspiciousBlocks commands"
        default: true
    unsuspiciousblocks.admin:
        description: "Allows the use of UnsuspiciousBlocks admin commands"
        default: op
commands:
  unsuspiciousblocks:
    aliases: [unsusblocks,unsuspicious,unsus,usbl]
    description: "Command for controlling UnsuspiciousBlocks plugin"
    usage: "/unsuspiciousblocks [enable|disable|hint-toggle|help]"
    permission: unsuspiciousblocks.use
    permission-message: "You do not have permission to use this command"